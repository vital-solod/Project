<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Створення профілю Flowspace" />
    <title>Створення профілю — Flowspace</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="profile-page">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Flowspace — на головну">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>EasyStudy</span>
      </a>
      <a class="back-link" href="./index.html">← На головну</a>
    </header>

    <main class="profile-main">
      <section class="profile-card" aria-labelledby="profile-title">
        <div class="profile-card__intro">
          <p class="eyebrow eyebrow--purple">ПОЧИНАЄМО СПОКІЙНО</p>
          <h1 id="profile-title">Створи свій<br /><span>навчальний простір.</span></h1>
          <p>Заповни кілька простих полів, щоб Flowspace міг підлаштувати план під тебе.</p>
        </div>

        <form class="profile-form" action="./index.html" method="get">
          <label for="name">Як тебе звати?</label>
          <input id="name" name="name" type="text" placeholder="Наприклад, Марія" required />

          <label for="class">Твій клас</label>
          <select id="class" name="class" required>
            <option value="" disabled selected>Обери свій клас</option>
            <option>8 клас</option>
            <option>9 клас</option>
            <option>10 клас</option>
            <option>11 клас</option>
          </select>

          <label for="goal">На чому хочеш зосередитися?</label>
          <textarea id="goal" name="goal" rows="4" placeholder="Наприклад, не пропускати дедлайни та встигати відпочивати"></textarea>

          <button class="button profile-form__submit" type="submit">
            Створити мій простір <span aria-hidden="true">→</span>
          </button>
          <p class="profile-form__note">Без реєстрації. Дані залишаються у твоєму браузері.</p>
        </form>
      </section>
    </main>
    <footer>
      <span class="brand"><span class="brand-mark" aria-hidden="true">✦</span> EasyStudy</span>
      <div class="footer-contact">
        <a href="mailto:hello@easystudy.ua">hello@easystudy.ua</a>
        <a href="tel:+380671234567">+380 67 123 45 67</a>
      </div>
    </footer>
  </body>
</html>
